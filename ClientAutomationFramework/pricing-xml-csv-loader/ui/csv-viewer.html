<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CSV Viewer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.4;
  }
  h1 { font-size: 1.4rem; }
  section {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  button {
    margin-top: 0.75rem;
    margin-right: 0.5rem;
    padding: 0.45rem 0.9rem;
    font-size: 0.9rem;
    border: 1px solid #888;
    border-radius: 4px;
    background: #f4f4f4;
    cursor: pointer;
  }
  button:hover { background: #e8e8e8; }
  button.primary { background: #1a5fd6; color: white; border-color: #1a5fd6; }
  button.primary:hover { background: #164db3; }
  .status { margin-top: 0.6rem; font-size: 0.85rem; }
  .status.ok { color: #147a2e; }
  .status.err { color: #c0341d; }
  .hint { font-size: 0.8rem; color: #666; margin-top: 0.4rem; }
  #csvTable {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.75rem;
    font-size: 0.85rem;
    table-layout: fixed;
  }
  #csvTable th, #csvTable td {
    text-align: left;
    vertical-align: top;
    padding: 0.5rem 0.6rem;
    border: 1px solid #eee;
  }
  #csvTable th {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
    background: #fafafa;
  }
  #csvTable th:first-child, #csvTable td:first-child { width: 160px; }
  #csvTable td textarea {
    width: 100%;
    height: 160px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    white-space: pre;
    border: none;
    padding: 0;
    resize: vertical;
  }
</style>
</head>
<body>

<h1>CSV Viewer</h1>
<p class="hint">Read-only view of scenarios.csv. Reopens the last-viewed file automatically on refresh.</p>

<section>
  <button id="openCsvBtn">Open scenarios.csv…</button>
  <button id="refreshBtn">Refresh</button>
  <div class="hint" id="csvLabel">No file open yet.</div>
  <div class="status" id="csvStatus"></div>
</section>

<table id="csvTable" hidden>
  <thead>
    <tr><th>scenario_id</th><th>xml</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const openCsvBtn = document.getElementById('openCsvBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const csvLabel = document.getElementById('csvLabel');
  const csvStatus = document.getElementById('csvStatus');
  const csvTable = document.getElementById('csvTable');

  const supportsFsAccess = 'showOpenFilePicker' in window;
  let fileHandle = null;
  let pendingFileHandle = null; // remembered handle awaiting permission reconfirmation

  if (!supportsFsAccess) {
    openCsvBtn.disabled = true;
    refreshBtn.disabled = true;
    csvLabel.textContent = "This browser doesn't support the File System Access API needed for this page — try Chrome or Edge.";
  }

  function setStatus(message, isError) {
    csvStatus.textContent = message;
    csvStatus.className = 'status ' + (isError ? 'err' : 'ok');
  }

  // ---------- RFC4180 CSV parsing (same logic as index.html) ----------
  function parseCsv(text) {
    const records = [];
    let i = 0;
    const len = text.length;

    function parseField() {
      let field = '';
      if (text[i] === '"') {
        i++;
        while (i < len) {
          if (text[i] === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 2; }
            else { i++; break; }
          } else {
            field += text[i]; i++;
          }
        }
      } else {
        while (i < len && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') {
          field += text[i]; i++;
        }
      }
      return field;
    }

    function parseRecord() {
      const record = [parseField()];
      while (text[i] === ',') { i++; record.push(parseField()); }
      if (text[i] === '\r') i++;
      if (text[i] === '\n') i++;
      return record;
    }

    while (i < len) records.push(parseRecord());
    while (records.length && records[records.length - 1].length === 1 && records[records.length - 1][0] === '') {
      records.pop();
    }

    const [, ...body] = records; // drop header row
    return body.map((r) => ({ scenario_id: r[0] ?? '', xml: r[1] ?? '' }));
  }

  function renderTable(rows) {
    const tbody = csvTable.querySelector('tbody');
    tbody.innerHTML = '';
    for (const row of rows) {
      const tr = document.createElement('tr');
      const idTd = document.createElement('td');
      idTd.textContent = row.scenario_id;
      const xmlTd = document.createElement('td');
      const textarea = document.createElement('textarea');
      textarea.readOnly = true;
      textarea.value = row.xml;
      xmlTd.appendChild(textarea);
      tr.appendChild(idTd);
      tr.appendChild(xmlTd);
      tbody.appendChild(tr);
    }
    csvTable.hidden = rows.length === 0;
  }

  // ---------- IndexedDB persistence for the file handle (same pattern as index.html's baseFolder) ----------
  function openHandleDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('scenario-xml-loader', 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains('handles')) req.result.createObjectStore('handles');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveFileHandle(handle) {
    const db = await openHandleDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'csvFile');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadFileHandle() {
    const db = await openHandleDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('csvFile');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- read + render the currently active handle ----------
  async function readAndRender(handle) {
    const file = await handle.getFile(); // always reflects current disk content, no caching
    const rows = parseCsv(await file.text());
    renderTable(rows);
    csvLabel.textContent = `Open: ${handle.name}`;
    setStatus(`Loaded ${rows.length} row(s) at ${new Date().toLocaleTimeString()}.`, false);
  }

  function markActive(handle) {
    fileHandle = handle;
    pendingFileHandle = null;
    openCsvBtn.textContent = 'Open scenarios.csv…';
  }

  openCsvBtn.addEventListener('click', async () => {
    try {
      if (pendingFileHandle) {
        const permission = await pendingFileHandle.requestPermission({ mode: 'read' });
        if (permission === 'granted') {
          markActive(pendingFileHandle);
          await readAndRender(fileHandle);
          return;
        }
        setStatus('Access not granted — pick a file instead.', true);
      }

      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
      });
      await saveFileHandle(handle);
      markActive(handle);
      await readAndRender(handle);
    } catch (err) {
      if (err.name !== 'AbortError') setStatus('Could not open file: ' + err.message, true);
    }
  });

  refreshBtn.addEventListener('click', async () => {
    if (!fileHandle) { setStatus('Open a file first.', true); return; }
    try {
      await readAndRender(fileHandle);
    } catch (err) {
      setStatus('Could not re-read file: ' + err.message, true);
    }
  });

  // On load (including a plain page refresh): try to reuse whatever was remembered.
  (async () => {
    if (!supportsFsAccess) return;
    try {
      const stored = await loadFileHandle();
      if (!stored) return;

      const permission = await stored.queryPermission({ mode: 'read' });
      if (permission === 'granted') {
        markActive(stored);
        await readAndRender(stored);
      } else {
        pendingFileHandle = stored;
        openCsvBtn.textContent = `Reconnect to "${stored.name}"…`;
        csvLabel.textContent = `Remembered "${stored.name}" — click "Reconnect" to restore access.`;
      }
    } catch (err) {
      // No stored handle, or IndexedDB unavailable — leave the plain "no file open" state.
    }
  })();
</script>
</body>
</html>
