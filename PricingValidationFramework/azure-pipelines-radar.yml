trigger: none
pr: none

parameters:
  - name: thresholdType
    displayName: Threshold type - Pound compares the £ difference, Percentage the % change, against the minimum and maximum below
    type: string
    default: Pound
    values:
      - Pound
      - Percentage
  - name: minThreshold
    displayName: Minimum threshold, in £ or % by the threshold type, e.g. -2 (empty uses the RadarMinThreshold variable)
    type: string
    default: ' '
  - name: maxThreshold
    displayName: Maximum threshold, in £ or % by the threshold type, e.g. 2 (empty uses the RadarMaxThreshold variable)
    type: string
    default: ' '
  - name: scenarioTag
    displayName: Scenario tag filter - one tag from Test_tags, e.g. smoke (empty for all)
    type: string
    default: ' '
  - name: iceSelection
    displayName: Which baselines ICE checks
    type: string
    default: newestPerProductScheme
    values:
      - radarRun
      - newestPerProductScheme

pool:
  vmImage: ubuntu-latest

# Radar selects scenarios with the TestTag variable (TEST_TAG: an exact Product_code, empty for all)
# and the scenarioTag parameter (SCENARIO_TAG: one tag from Test_tags, empty for all).
# ICE then checks, by iceSelection:
#   radarRun               - exactly the scenarios that passed in this run's Radar report (default)
#   newestPerProductScheme - the newest PASS baseline per product/scheme within the same filters
# ICE always follows Radar, but only once someone approves it: its job targets the pricing-ice-validation
# environment, whose Approvals check holds the stage until approved (rejecting it skips ICE).
# The Build stage compiles the test project once and publishes it as the test-build artifact; Radar and ICE
# both run that same build with dotnet test on its DLL, without checking out or compiling the repository.
# Both reports share the run's BUILD_BUILDID. The run's Summary tab shows the threshold type, min/max and filters
# used, with each scenario's result, so the report's Difference column can be read as £ or %.
stages:
  - stage: Build
    displayName: Build tests
    jobs:
      - job: BuildTests
        timeoutInMinutes: 30
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x
          - pwsh: |
              dotnet build PricingValidationFramework/PricingValidationFramework.Tests/PricingValidationFramework.Tests.csproj --configuration Release
              exit $LASTEXITCODE
            displayName: Build test project
          - task: PublishPipelineArtifact@1
            displayName: Publish test-build artifact
            inputs:
              targetPath: '$(Build.SourcesDirectory)/PricingValidationFramework/PricingValidationFramework.Tests/bin/Release/net10.0'
              artifact: test-build

  - stage: Radar
    displayName: Radar validation
    dependsOn: Build
    jobs:
      - job: RadarValidation
        timeoutInMinutes: 360
        steps:
          - checkout: none
          - download: current
            artifact: test-build
            displayName: Download the test build
          # dotnet test needs the SDK, but runs the downloaded DLL without compiling anything.
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - pwsh: |
              # Min/max: the run form's value, otherwise the pipeline variable. Checked here so a typo stops the
              # run before any Radar call, and recorded for the run summary.
              function Resolve-Threshold([string]$label, [string]$entered, [string]$variable) {
                foreach ($candidate in @($entered, $variable)) {
                  $value = "$candidate".Trim()
                  if ($value -and -not $value.StartsWith('$(')) {
                    if ($value -notmatch '^[+-]?(\d+(\.\d+)?|\.\d+)$') { throw "$label '$value' must be a number with a '.' decimal point, e.g. -2 or 0.5." }
                    return $value
                  }
                }
                throw "$label is required: enter it on the run form or define the pipeline variable."
              }
              $min = Resolve-Threshold 'Minimum threshold' $env:MIN_THRESHOLD_INPUT $env:MIN_THRESHOLD_VARIABLE
              $max = Resolve-Threshold 'Maximum threshold' $env:MAX_THRESHOLD_INPUT $env:MAX_THRESHOLD_VARIABLE
              if ([decimal]::Parse($min, [Globalization.CultureInfo]::InvariantCulture) -gt [decimal]::Parse($max, [Globalization.CultureInfo]::InvariantCulture)) {
                throw "The minimum threshold ($min) must not be more than the maximum ($max)."
              }
              $env:RADAR_MIN_THRESHOLD = $min
              $env:RADAR_MAX_THRESHOLD = $max
              Write-Host "Threshold type ${{ parameters.thresholdType }}, minimum $min, maximum $max."
              Write-Host "##vso[task.setvariable variable=ResolvedMinThreshold]$min"
              Write-Host "##vso[task.setvariable variable=ResolvedMaxThreshold]$max"

              dotnet test '$(Pipeline.Workspace)/test-build/PricingValidationFramework.Tests.dll' --filter "FullyQualifiedName~PricingValidationFramework.Tests.Integration.Radar.RadarValidationTests" --logger "trx;LogFileName=Radar.trx" --results-directory "$(Agent.TempDirectory)/RadarTestResults" -- NUnit.ExplicitMode=Relaxed
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              [xml]$results = Get-Content '$(Agent.TempDirectory)/RadarTestResults/Radar.trx'
              if ([int]$results.TestRun.ResultSummary.Counters.executed -eq 0) { throw 'No Radar integration tests executed.' }
            displayName: Run Radar integration tests only
            env:
              DOTNET_ENVIRONMENT: Uat
              DatabaseSettings__ConnectionString: $(RadarDatabaseConnectionString)
              RadarSettings__Endpoints__Endpoint1__BaseUrl: $(RadarEndpoint1Url)
              RadarSettings__Endpoints__Endpoint1__ApiKeyHeaderName: $(RadarEndpoint1KeyHeader)
              RadarSettings__Endpoints__Endpoint1__ApiKeyValue: $(RadarEndpoint1ApiKey)
              RadarSettings__Endpoints__Endpoint2__BaseUrl: $(RadarEndpoint2Url)
              RadarSettings__Endpoints__Endpoint2__ApiKeyHeaderName: $(RadarEndpoint2KeyHeader)
              RadarSettings__Endpoints__Endpoint2__ApiKeyValue: $(RadarEndpoint2ApiKey)
              RadarSettings__Endpoints__Endpoint3__BaseUrl: $(RadarEndpoint3Url)
              RadarSettings__Endpoints__Endpoint3__ApiKeyHeaderName: $(RadarEndpoint3KeyHeader)
              RadarSettings__Endpoints__Endpoint3__ApiKeyValue: $(RadarEndpoint3ApiKey)
              MIN_THRESHOLD_INPUT: ${{ parameters.minThreshold }}
              MAX_THRESHOLD_INPUT: ${{ parameters.maxThreshold }}
              MIN_THRESHOLD_VARIABLE: $(RadarMinThreshold)
              MAX_THRESHOLD_VARIABLE: $(RadarMaxThreshold)
              RADAR_THRESHOLD_TYPE: ${{ parameters.thresholdType }}
              TEST_TAG: $(TestTag)
              SCENARIO_TAG: ${{ parameters.scenarioTag }}
              RADAR_REQUEST_DATETIME: $(RadarRequestDateTime)

          - task: PublishTestResults@2
            condition: always()
            displayName: Publish Radar test results
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/RadarTestResults/Radar.trx'
              testRunTitle: Radar integration
              failTaskOnMissingResultsFile: true

          - pwsh: |
              $resultDirectory = '$(Pipeline.Workspace)/test-build/TestResults'
              $artifactDirectory = '$(Build.ArtifactStagingDirectory)/RadarReports'
              New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
              $missing = @()
              foreach ($output in @(@{ Folder = 'Reports'; Pattern = 'Radar_*.csv' }, @{ Folder = 'Logs'; Pattern = 'Radar_*.log' })) {
                $source = Join-Path $resultDirectory $output.Folder
                $target = Join-Path $artifactDirectory $output.Folder
                New-Item -ItemType Directory -Force -Path $target | Out-Null
                $files = @(if (Test-Path $source) { Get-ChildItem $source -Filter $output.Pattern -File })
                if ($files.Count -eq 0) { $missing += $output.Folder } else { $files | Copy-Item -Destination $target }
              }
              if ($missing.Count -gt 0) { throw "Missing Radar outputs: $($missing -join ', '). Available outputs have been staged." }
            condition: always()
            displayName: Stage Radar reports and logs

          - pwsh: |
              # The run's Summary tab: the threshold type, min/max and filters used, then each scenario's result.
              $report = '$(Pipeline.Workspace)/test-build/TestResults/Reports/Radar_$(Build.BuildId).csv'
              $summary = '$(Agent.TempDirectory)/radar-summary.md'
              function Shown([string]$value, [string]$empty) { $value = "$value".Trim(); if (-not $value -or $value.StartsWith('$(')) { $empty } else { $value } }
              $type = '${{ parameters.thresholdType }}'
              $unit = if ($type -eq 'Percentage') { '%' } else { '£' }
              $lines = @(
                '## Radar run'
                ''
                '| Setting | Value |'
                '|---|---|'
                "| Threshold type | **$type** (difference in $unit) |"
                "| Minimum | $(Shown $env:MIN_THRESHOLD 'not resolved') $unit |"
                "| Maximum | $(Shown $env:MAX_THRESHOLD 'not resolved') $unit |"
                "| Product (TestTag) | $(Shown $env:TEST_TAG 'all') |"
                "| Scenario tag (Test_tags) | $(Shown $env:SCENARIO_TAG 'all') |"
                "| Request time | $(Shown $env:REQUEST_TIME 'now') |"
                "| Build ID | $(Build.BuildId) |"
                ''
              )
              if (-not (Test-Path $report)) {
                $lines += "> No Radar report was written ($report). See the test results and logs."
              } else {
                $rows = @(Import-Csv $report)
                $runLevel = @($rows | Where-Object { $_.ScenarioId -in @('RadarDiscovery', 'RadarRun') })
                $scenarios = @($rows | Where-Object { $_.ScenarioId -notin @('RadarDiscovery', 'RadarRun') } | Group-Object ScenarioId)
                $counts = $scenarios | Group-Object { $_.Group[0].ScenarioResult } | ForEach-Object { "$($_.Name) $($_.Count)" }
                $lines += "**$($scenarios.Count) scenario(s):** $(if ($counts) { $counts -join ', ' } else { 'none' })"
                foreach ($row in $runLevel) { $lines += ''; $lines += "> **$($row.ScenarioId):** $($row.Error)" }
                if ($scenarios.Count) {
                  $lines += ''
                  $lines += '| Scenario | Result | Detail |'
                  $lines += '|---|---|---|'
                  foreach ($scenario in $scenarios | Select-Object -First 200) {
                    $first = $scenario.Group[0]
                    $detail = switch ($first.ScenarioResult) {
                      'PASS' { "$($scenario.Group.Count) field(s) within $(Shown $env:MIN_THRESHOLD '?') to $(Shown $env:MAX_THRESHOLD '?') $unit" }
                      'FAIL' { ($scenario.Group | Where-Object { $_.FieldResult -ne 'PASS' } | ForEach-Object { "$($_.FieldName): $($_.BaselineValue) → $($_.ApiValue) ($(if ($_.Difference) { "$($_.Difference) $unit" } else { 'no difference' }))" }) -join '; ' }
                      default { "$($first.FailureStage): $($first.Error)" }
                    }
                    $lines += "| $($scenario.Name) | **$($first.ScenarioResult)** | $("$detail".Replace('|', '\|')) |"
                  }
                  if ($scenarios.Count -gt 200) { $lines += ''; $lines += "First 200 of $($scenarios.Count) scenarios shown; the RadarReports artifact has them all." }
                }
              }
              $lines | Set-Content -Path $summary -Encoding utf8
              Write-Host "##vso[task.uploadsummary]$summary"
            condition: always()
            displayName: Write the run summary
            env:
              MIN_THRESHOLD: $(ResolvedMinThreshold)
              MAX_THRESHOLD: $(ResolvedMaxThreshold)
              TEST_TAG: $(TestTag)
              SCENARIO_TAG: ${{ parameters.scenarioTag }}
              REQUEST_TIME: $(RadarRequestDateTime)

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: Publish Radar reports and logs
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/RadarReports'
              artifact: RadarReports

  - stage: Ice
    displayName: ICE validation (needs approval)
    dependsOn:
      - Build
      - Radar
    # Runs when Radar passed or reported FAIL/ERROR scenarios (ICE reads only PASS baselines);
    # skipped if the build failed or the run is cancelled. With radarRun it needs this run's RadarReports artifact.
    condition: and(eq(dependencies.Build.result, 'Succeeded'), in(dependencies.Radar.result, 'Succeeded', 'SucceededWithIssues', 'Failed'))
    jobs:
      # A deployment job, so the environment's Approvals check applies: the stage waits until an approver
      # approves it. Set up once in Azure DevOps: Pipelines > Environments > pricing-ice-validation >
      # Approvals and checks > Approvals.
      - deployment: IceValidation
        timeoutInMinutes: 120
        environment: pricing-ice-validation
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs would download every artifact; take only the ones needed. No checkout: ICE
                # runs the test build from the Build stage.
                - download: none
                - download: current
                  artifact: test-build
                  displayName: Download the test build

                - task: UseDotNet@2
                  displayName: Use .NET 10
                  inputs:
                    packageType: sdk
                    version: 10.0.x

                - ${{ if eq(parameters.iceSelection, 'radarRun') }}:
                    - download: current
                      artifact: RadarReports
                      displayName: Download this run's Radar report

                - pwsh: |
                    dotnet test '$(Pipeline.Workspace)/test-build/PricingValidationFramework.Tests.dll' --filter "FullyQualifiedName~PricingValidationFramework.Tests.Integration.Ice.IceValidationTests" --logger "trx;LogFileName=Ice.trx" --results-directory "$(Agent.TempDirectory)/IceTestResults" -- NUnit.ExplicitMode=Relaxed
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    [xml]$results = Get-Content '$(Agent.TempDirectory)/IceTestResults/Ice.trx'
                    if ([int]$results.TestRun.ResultSummary.Counters.executed -eq 0) { throw 'No ICE integration tests executed.' }
                  displayName: Run ICE integration tests only
                  env:
                    DOTNET_ENVIRONMENT: Uat
                    DatabaseSettings__ConnectionString: $(IceDatabaseConnectionString)
                    IceSettings__IceEndpoint: $(IceEndpoint)
                    IceSettings__ApiKeyHeaderName: $(IceApiKeyHeaderName)
                    IceSettings__ApiKeyHeaderValue: $(IceApiKeyHeaderValue)
                    IceSettings__PfxCertificateBase64: $(IcePfxCertificateBase64)
                    IceSettings__CertificatePassword: $(IceCertificatePassword)
                    TEST_TAG: $(TestTag)
                    SCENARIO_TAG: ${{ parameters.scenarioTag }}
                    ${{ if eq(parameters.iceSelection, 'radarRun') }}:
                      ICE_RADAR_REPORT: $(Pipeline.Workspace)/RadarReports/Reports/Radar_$(Build.BuildId).csv

                - task: PublishTestResults@2
                  condition: always()
                  displayName: Publish ICE test results
                  inputs:
                    testResultsFormat: VSTest
                    testResultsFiles: '$(Agent.TempDirectory)/IceTestResults/Ice.trx'
                    testRunTitle: ICE integration
                    failTaskOnMissingResultsFile: true

                - pwsh: |
                    $resultDirectory = '$(Pipeline.Workspace)/test-build/TestResults'
                    $artifactDirectory = '$(Build.ArtifactStagingDirectory)/IceReports'
                    New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
                    $missing = @()
                    foreach ($output in @(@{ Folder = 'Reports'; Pattern = 'Ice_*.csv' }, @{ Folder = 'Logs'; Pattern = 'Ice_*.log' })) {
                      $source = Join-Path $resultDirectory $output.Folder
                      $target = Join-Path $artifactDirectory $output.Folder
                      New-Item -ItemType Directory -Force -Path $target | Out-Null
                      $files = @(if (Test-Path $source) { Get-ChildItem $source -Filter $output.Pattern -File })
                      if ($files.Count -eq 0) { $missing += $output.Folder } else { $files | Copy-Item -Destination $target }
                    }
                    if ($missing.Count -gt 0) { throw "Missing ICE outputs: $($missing -join ', '). Available outputs have been staged." }
                  condition: always()
                  displayName: Stage ICE reports and logs

                - task: PublishPipelineArtifact@1
                  condition: always()
                  displayName: Publish ICE reports and logs
                  inputs:
                    targetPath: '$(Build.ArtifactStagingDirectory)/IceReports'
                    artifact: IceReports
